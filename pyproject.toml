[project]
name = "modia-hddl"
version = "0.1.0"
description = "TP 5ModIA - High Dimensional Data & Deep Learning"
requires-python = ">=3.11,<3.13"

# Environnement unique pour toute la serie.
dependencies = [
    "torch>=2.6,<2.7",
    "torchvision>=0.21,<0.22",
    "torchinfo",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "pillow",
    "tqdm",
    "nvidia-cuda-nvrtc-cu12==12.6.77",
    "nvidia-cuda-runtime-cu12==12.6.77",
    "nvidia-cuda-cupti-cu12==12.6.80",
    "nvidia-cudnn-cu12==9.5.1.17",
    "nvidia-cublas-cu12==12.6.4.1",
    "nvidia-cufft-cu12==11.3.0.4",
    "nvidia-curand-cu12==10.3.7.77",
    "nvidia-cusolver-cu12==11.7.1.2",
    "nvidia-cusparse-cu12==12.5.4.2",
    "nvidia-cusparselt-cu12==0.6.3",
    "nvidia-nccl-cu12==2.21.5",
    "nvidia-nvtx-cu12==12.6.77",
    "nvidia-nvjitlink-cu12==12.6.85",
]

# Un groupe par TP : documentaire, tout est installe ensemble.
[dependency-groups]

ssl = []
cnn = [] 
vision-cnn = []
autoencoders = []
rnn = []
gnn = []

transformers = [
#    "transformers",
#    "datasets",
#    "evaluate",
#    "tokenizers",
#    "accelerate",
#    "sentencepiece",
]

llm = [
    "sentence-transformers",
]

dev = [
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    "nbformat",
    "nbconvert",
]

[tool.uv]
default-groups = [
    "ssl", "cnn", "vision-cnn", "autoencoders",
    "rnn", "gnn", "transformers", "llm", "dev",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu",   marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu",   marker = "sys_platform == 'darwin'" },
]
