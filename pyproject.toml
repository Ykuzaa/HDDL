[project]
name = "modia-hddl"
version = "0.1.0"
description = "TP 5ModIA - High Dimensional Data & Deep Learning"
requires-python = ">=3.11,<3.13"

# Environnement unique pour toute la serie.
dependencies = [
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
    "torchinfo",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "pillow",
    "tqdm",
]

# Un groupe par TP : documentaire, tout est installe ensemble.
[dependency-groups]

ssl = []
cnn = [] 
vision-cnn = []
autoencoders = []
rnn = []
gnn = []

transformers = [
#    "transformers",
#    "datasets",
#    "evaluate",
#    "tokenizers",
#    "accelerate",
#    "sentencepiece",
]

llm = [
    "sentence-transformers",
]

dev = [
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    "nbformat",
    "nbconvert",
]

[tool.uv]
default-groups = [
    "ssl", "cnn", "vision-cnn", "autoencoders",
    "rnn", "gnn", "transformers", "llm", "dev",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu",   marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cpu",   marker = "sys_platform == 'darwin'" },
]